<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0314"/>
      <stop offset="45%" stop-color="#140628"/>
      <stop offset="85%" stop-color="#1c1248"/>
      <stop offset="100%" stop-color="#2a0845"/>
    </linearGradient>

    <!-- Neon Yellow Glow -->
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e2ff00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e2ff00" stop-opacity="0"/>
    </radialGradient>

    <!-- Phone 1 Gradient (Dark Green) -->
    <linearGradient id="phoneGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b7a68"/>
      <stop offset="50%" stop-color="#1f4b3e"/>
      <stop offset="100%" stop-color="#0d241d"/>
    </linearGradient>

    <!-- Phone 2 Gradient (Cyan Blue) -->
    <linearGradient id="phoneCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Phone 3 Gradient (Deep Cobalt Blue) -->
    <linearGradient id="phoneBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Phone 4 Gradient (Peach Pink Metallic) -->
    <linearGradient id="phonePeach" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="40%" stop-color="#fb7185"/>
      <stop offset="80%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="phoneShadow" x="-20%" y="-10%" width="150%" height="130%">
      <feDropShadow dx="-10" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Dark Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- Left Side Text & Offer Content -->
  <g transform="translate(70, 0)">
    <!-- Subtitle / Main Bold Heading Line 1 -->
    <text x="0" y="150" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="70" font-weight="900" letter-spacing="1">UNBEATABLE</text>
    
    <!-- Main Bold Heading Line 2 -->
    <text x="0" y="230" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="70" font-weight="900" letter-spacing="1">MOBILE DEALS</text>

    <!-- Neon Yellow Discount Circular Badge -->
    <g transform="translate(490, 185)">
      <circle cx="0" cy="0" r="80" fill="#e2ff00" filter="drop-shadow(0 4px 15px rgba(226, 255, 0, 0.4))"/>
      <text x="0" y="-24" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="0.5">UP TO</text>
      <text x="0" y="24" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" text-anchor="middle">15%</text>
      <text x="0" y="48" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="1">OFF*</text>
    </g>

    <!-- Magenta 'Shop Now' Action Pill Button -->
    <g transform="translate(0, 275)" cursor="pointer">
      <rect width="210" height="56" rx="28" fill="#ec4899" filter="drop-shadow(0 6px 12px rgba(236, 72, 153, 0.45))"/>
      <text x="105" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" text-anchor="middle">Shop Now</text>
    </g>
  </g>

  <!-- Right Side: 4 Premium Smartphones Lineup -->
  <!-- Phone 1 (Deep Mint Green) -->
  <g transform="translate(630, 95) rotate(-3)" filter="url(#phoneShadow)">
    <rect width="112" height="225" rx="22" fill="url(#phoneGreen)" stroke="#4ade80" stroke-width="2" stroke-opacity="0.4"/>
    <!-- Camera Island -->
    <rect x="12" y="14" width="38" height="65" rx="12" fill="#0d241d" stroke="#3b7a68" stroke-width="1.5"/>
    <circle cx="31" cy="30" r="11" fill="#040d0a" stroke="#4ade80" stroke-width="1.5"/>
    <circle cx="31" cy="58" r="11" fill="#040d0a" stroke="#4ade80" stroke-width="1.5"/>
  </g>

  <!-- Phone 2 (Sky Cyan Blue) -->
  <g transform="translate(710, 85) rotate(-1)" filter="url(#phoneShadow)">
    <rect width="115" height="235" rx="24" fill="url(#phoneCyan)" stroke="#bae6fd" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Camera Island -->
    <rect x="14" y="14" width="40" height="70" rx="14" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="34" cy="32" r="12" fill="#082f49" stroke="#7dd3fc" stroke-width="2"/>
    <circle cx="34" cy="62" r="12" fill="#082f49" stroke="#7dd3fc" stroke-width="2"/>
  </g>

  <!-- Phone 3 (Cobalt Dark Blue) -->
  <g transform="translate(795, 75) rotate(1)" filter="url(#phoneShadow)">
    <rect width="120" height="250" rx="24" fill="url(#phoneBlue)" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Diagonal Camera Layout -->
    <rect x="14" y="14" width="46" height="75" rx="14" fill="#0f172a" stroke="#1d4ed8" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="12" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="42" cy="64" r="12" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Phone 4 (Metallic Rose Gold / Peach) -->
  <g transform="translate(885, 65) rotate(4)" filter="url(#phoneShadow)">
    <rect width="125" height="265" rx="26" fill="url(#phonePeach)" stroke="#fecdd3" stroke-width="2.5" stroke-opacity="0.7"/>
    <!-- Ripple Ring Pattern -->
    <circle cx="62" cy="132" r="80" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>
    <circle cx="62" cy="132" r="60" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>
    <!-- Camera Island -->
    <rect x="16" y="16" width="46" height="85" rx="16" fill="#881337" stroke="#fb7185" stroke-width="2"/>
    <circle cx="39" cy="36" r="13" fill="#4c0519" stroke="#fda4af" stroke-width="2"/>
    <circle cx="39" cy="72" r="13" fill="#4c0519" stroke="#fda4af" stroke-width="2"/>
  </g>

  <!-- Bottom Slider Dots Accent -->
  <g transform="translate(540, 420)">
    <circle cx="0" cy="0" r="4" fill="#ffffff" opacity="0.3"/>
    <circle cx="16" cy="0" r="4" fill="#ffffff" opacity="0.3"/>
    <circle cx="32" cy="0" r="4" fill="#ffffff" opacity="0.3"/>
    <circle cx="48" cy="0" r="5" fill="#f85606"/>
    <circle cx="64" cy="0" r="4" fill="#ffffff" opacity="0.3"/>
  </g>
</svg>
