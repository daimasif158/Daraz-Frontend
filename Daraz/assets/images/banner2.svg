<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
  <defs>
    <!-- Warm Cozy Living Room Gradient -->
    <linearGradient id="livingBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Warm Lamp Ambient Glow -->
    <radialGradient id="lampGlow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>

    <!-- Sofa Fabric Texture / Color -->
    <linearGradient id="sofaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Cushion Color -->
    <linearGradient id="cushionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Coffee Table Wood -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Deep Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#livingBg)"/>
  <rect width="100%" height="100%" fill="url(#lampGlow)"/>

  <!-- Left Side: Offer & Typography -->
  <g transform="translate(70, 0)">
    <!-- Small Tagline Badge -->
    <g transform="translate(0, 85)">
      <rect width="180" height="34" rx="4" fill="#f85606"/>
      <text x="90" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1">HOME &amp; LIVING</text>
    </g>

    <!-- Big Headings -->
    <text x="0" y="175" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="0.5">FURNITURE FOR</text>
    <text x="0" y="240" fill="#fef08a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="0.5">EVERY MOMENT</text>

    <!-- Discount Label -->
    <text x="0" y="295" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600">Starting from <tspan fill="#38bdf8" font-weight="800">Rs. 1,499</tspan> | Flat <tspan fill="#fbbf24" font-weight="800">60% OFF</tspan></text>

    <!-- Daraz Orange Call-To-Action Pill Button -->
    <g transform="translate(0, 330)" cursor="pointer">
      <rect width="210" height="54" rx="27" fill="#f85606" filter="drop-shadow(0 6px 14px rgba(248, 86, 6, 0.45))"/>
      <text x="105" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" text-anchor="middle">EXPLORE NOW</text>
    </g>
  </g>

  <!-- Right Side: Clean Modern Furniture Illustration -->
  <g transform="translate(680, 110)">
    <!-- Standing Modern Arc Lamp -->
    <path d="M 430,270 L 430,30 C 430,-40 310,-40 310,20 L 310,40" fill="none" stroke="#94a3b8" stroke-width="4"/>
    <path d="M 290,40 L 330,40 L 340,65 L 280,65 Z" fill="#fef08a" filter="drop-shadow(0 0 10px #fef08a)"/>
    <ellipse cx="430" cy="270" rx="24" ry="7" fill="#64748b"/>

    <!-- Premium 2-Seater Modern Fabric Sofa -->
    <g filter="url(#softShadow)">
      <!-- Sofa Backrest -->
      <rect x="20" y="40" width="360" height="130" rx="26" fill="url(#sofaGrad)"/>
      <line x1="200" y1="45" x2="200" y2="165" stroke="#0284c7" stroke-width="3" stroke-dasharray="4,4"/>

      <!-- Left & Right Armrests -->
      <rect x="0" y="80" width="45" height="120" rx="18" fill="#0284c7"/>
      <rect x="355" y="80" width="45" height="120" rx="18" fill="#0284c7"/>

      <!-- Sofa Base Cushion Seats -->
      <rect x="35" y="130" width="160" height="75" rx="16" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="205" y="130" width="160" height="75" rx="16" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>

      <!-- Accent Cushions (Yellow & Orange) -->
      <rect x="48" y="105" width="55" height="55" rx="12" fill="url(#cushionGrad)" transform="rotate(-12 48 105)"/>
      <rect x="300" y="100" width="55" height="55" rx="12" fill="url(#cushionGrad)" transform="rotate(15 300 100)"/>

      <!-- Sofa Wooden Legs -->
      <polygon points="50,200 40,240 54,240 60,200" fill="#78350f"/>
      <polygon points="350,200 360,240 346,240 340,200" fill="#78350f"/>
    </g>

    <!-- Wooden Minimalist Coffee Table -->
    <g transform="translate(110, 190)" filter="url(#softShadow)">
      <ellipse cx="90" cy="30" rx="90" ry="22" fill="url(#woodGrad)"/>
      <!-- Legs -->
      <line x1="30" y1="45" x2="15" y2="90" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
      <line x1="150" y1="45" x2="165" y2="90" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
      <line x1="90" y1="50" x2="90" y2="92" stroke="#542307" stroke-width="6" stroke-linecap="round"/>
      
      <!-- Coffee Mug on Table -->
      <rect x="78" y="10" width="18" height="16" rx="3" fill="#ffffff"/>
      <path d="M 96,14 C 102,14 102,22 96,22" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    </g>

    <!-- Indoor Plant Pot -->
    <g transform="translate(-40, 150)">
      <polygon points="20,70 12,120 48,120 40,70" fill="#e2e8f0"/>
      <!-- Green Leaves -->
      <path d="M 30,70 C 10,40 -10,35 -20,40 C -15,55 5,65 30,70 Z" fill="#10b981"/>
      <path d="M 30,70 C 25,30 30,10 40,0 C 45,20 40,50 30,70 Z" fill="#059669"/>
      <path d="M 30,70 C 45,45 65,40 75,45 C 68,60 50,68 30,70 Z" fill="#34d399"/>
    </g>
  </g>
</svg>
